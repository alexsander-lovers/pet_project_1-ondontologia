<header class="header">
  <div class="header__container container">

    <div class="header__wrapper-logo">
      <a class="header__link-logo logo" href="/" title="Home" aria-label="Home">
        <img class="logo__images" src="images/logo.svg" alt="" width="53" height="57">
      </a>

      <div class="header__inner-text">
        <p class="header__text">Ondontologia Integral</p>
        <p class="header__subtext">Salud & Estetica Dental</p>
      </div>

    </div>

    <div class="header__mobile-continer header__mobile-continer--is-active">
      <div class="header__mobile-icon-wrapper">
        <ul class="header__icon-list">
          <li class="header__icon-item">
            <a class="header__icon-link" href="/">
              <svg width="40" height="40" title="linkedin" aria-label="linkedin">
                <use href="images/icons/sprite/icons.svg#linkedin-icon" />
              </svg>
            </a>
          </li>
          <li class="header__icon-item">
            <a class="header__icon-link" href="/">
              <svg width="50" height="40" title="message" aria-label="message">
                <use href="images/icons/sprite/icons.svg#message-icon" />
              </svg>
            </a>
          </li>
          <li class="header__icon-item">
            <a class="header__icon-link" href="/">
              <svg width="50" height="40" title="instagram" aria-label="instagram">
                <use href="images/icons/sprite/icons.svg#instagram-icon" />
              </svg>
            </a>
          </li>
          <li class="header__icon-item">
            <a class="header__icon-link" href="/">
              <svg width="50" height="40" title="facebook" aria-label="facebook">
                <use href="images/icons/sprite/icons.svg#facebook-icon" />
              </svg>
            </a>
          </li>
        </ul>
      </div>

      <nav class="header__navigation">
        <ul class="header__list">
          <li class="header__item">
            <a class="header__link header__link--is-active" href="/">Inicio</a>
          </li>
          <li class="header__item">
            <a class="header__link" href="/">Servicios</a>
          </li>
          <li class="header__item">
            <a class="header__link" href="/">Nosotros</a>
          </li>
          <li class="header__item">
            <a class="header__link" href="/">Contacto</a>
          </li>
        </ul>
      </nav>

      <button class="header__button button button-another" type="button">
        Saca tu turno
      </button>
    </div>


    <button class="burger-menu burger-menu--is-active" type="button" title="burger-menu" aria-label="burger-menu">
      <span class="burger-menu__line"></span>
      <span class="burger-menu__line"></span>
      <span class="burger-menu__line"></span>
    </button>
  </div>
</header>
